<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="~/projects/binarypilot">
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}

.n{animation:lit 3.6s ease-in-out infinite}
@keyframes lit{0%,30%,100%{stroke-width:1;fill:#161b22}12%{stroke-width:2.5;fill:#1f2733}}
.d{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-9}}
.fl{animation:fl 3.6s steps(1) infinite}
@keyframes fl{0%,74%{opacity:.25}75%,100%{opacity:1}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<clipPath id="win"><rect width="860" height="250" rx="12"/></clipPath>
<g clip-path="url(#win)">
<rect width="860" height="250" fill="#0d1117"/>
<rect width="860" height="36" fill="#161b22"/>
<circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
<text x="430.0" y="23" font-size="13" fill="#8b949e" text-anchor="middle">~/projects/binarypilot</text>

<text x="28" y="76" font-size="26" font-weight="800" fill="#f0f6fc">binarypilot</text>
<rect x="222" y="57" width="74" height="24" rx="12" fill="none" stroke="#79c0ff"/><text x="259" y="74" font-size="12" fill="#79c0ff" text-anchor="middle">Python</text>
<rect x="306" y="57" width="98" height="24" rx="12" fill="none" stroke="#3fb950"/><text x="355" y="74" font-size="12" fill="#3fb950" text-anchor="middle">HackTheBox</text>
<rect x="414" y="57" width="84" height="24" rx="12" fill="none" stroke="#e3b341"/><text x="456" y="74" font-size="12" fill="#e3b341" text-anchor="middle">FlagYard</text>
<text x="832" y="74" font-size="13" fill="#8b949e" text-anchor="end">open →</text>
<text x="28" y="110" font-size="15" fill="#c9d1d9">Autonomous CTF solver — agent-based, built for HackTheBox + FlagYard.</text>
<line x1="220" y1="170" x2="260" y2="170" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5" class="d"/><line x1="410" y1="170" x2="450" y2="170" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5" class="d"/><line x1="600" y1="170" x2="640" y2="170" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5" class="d"/><rect x="70" y="150" width="150" height="40" rx="8" fill="#161b22" stroke="#39d0d8" class="n" style="animation-delay:0.0s"/><text x="145.0" y="175" font-size="14" fill="#39d0d8" text-anchor="middle">recon</text><rect x="260" y="150" width="150" height="40" rx="8" fill="#161b22" stroke="#79c0ff" class="n" style="animation-delay:0.9s"/><text x="335.0" y="175" font-size="14" fill="#79c0ff" text-anchor="middle">analyze</text><rect x="450" y="150" width="150" height="40" rx="8" fill="#161b22" stroke="#f778ba" class="n" style="animation-delay:1.8s"/><text x="525.0" y="175" font-size="14" fill="#f778ba" text-anchor="middle">exploit</text><rect x="640" y="150" width="150" height="40" rx="8" fill="#161b22" stroke="#3fb950" class="n" style="animation-delay:2.7s"/><text x="715.0" y="175" font-size="14" fill="#3fb950" text-anchor="middle">flag</text>
<circle r="5" fill="#f0f6fc"><animate attributeName="cx" values="145.0;715.0" dur="3.6s" repeatCount="indefinite"/><animate attributeName="cy" values="140;140" dur="3.6s" repeatCount="indefinite"/></circle>
<text x="28" y="230" font-size="13" fill="#8b949e">[agent] loop until solved</text>
<text class="fl" x="832" y="230" font-size="13" fill="#3fb950" text-anchor="end">[+] flag captured</text>

</g>
<rect x=".5" y=".5" width="859" height="249" rx="12" fill="none" stroke="#30363d"/>
</svg>
